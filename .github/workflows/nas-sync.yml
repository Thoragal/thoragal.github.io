name: Sync to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, nas]
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: In NAS-Ordner kopieren
        run: rsync -a --delete --exclude .git ./ /deploy/

        
